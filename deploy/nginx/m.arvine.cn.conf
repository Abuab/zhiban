# 知伴 API 反向代理站点配置
# 依据：docs/architecture.md §1「接入层 Nginx 443/80：HTTPS + HSTS」
#       docs/architecture.md §6「安全基线映射」
# 生效方式：软链到 /etc/nginx/conf.d/m.arvine.cn.conf（本文件随仓库版本管理）
# 证书：Let's Encrypt，certbot webroot 模式签发；续期由 certbot-renew.timer 触发
#       （续期后由 /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh 重载 nginx）

# ---------------------------------------------------------------------------
# HTTP：只承担 ACME 挑战与跳转 HTTPS（小程序 request 也必须走 https）
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name m.arvine.cn;

    # ACME HTTP-01 挑战目录，证书续期依赖此路径，不得删除
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS：业务 API 反代到本机 NestJS（127.0.0.1:3000）
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name m.arvine.cn;

    ssl_certificate     /etc/letsencrypt/live/m.arvine.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/m.arvine.cn/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # 仅 TLS1.2/1.3；TLS1.3 套件由 OpenSSL 默认策略决定，无需显式指定
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # HSTS：不下发 includeSubDomains（同机另有 date.arvine.cn 等子域，未就绪会被误伤），
    # 也不加 preload（preload 列表移除困难，上线稳定后再评估）
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 报告生成 / 材料上传的后续模块需要，先给一个宽松但有限的上限
    client_max_body_size 10m;
    client_body_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 【必须覆写而非追加】服务端 RateLimitGuard.resolveIp 只采信来自本机回环的
        # X-Forwarded-For，并取「最后一段」。若写成 $proxy_add_x_forwarded_for，
        # 客户端自带的伪造 IP 会留在首位，限流可被绕过（已实测 70/70 绕过）。
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
