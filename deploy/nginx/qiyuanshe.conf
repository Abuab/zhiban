# date.arvine.cn / www.arvine.cn —— 同机 qiyuanshe 项目的入口（宿主级 Nginx vhost）
# 背景（2026-09-19 裁决）：服务器 Nginx 升级为「唯一入口」，zhiban 与 qiyuanshe 共用。
#   域名归属：m.arvine.cn 专属于 zhiban；date.arvine.cn 与 www.arvine.cn 属于 qiyuanshe。
#   - 本文件归 zhiban 仓库管理（宿主 Nginx 已是服务器级基础设施，配置随仓库版本化）
#   - qiyuanshe 自身按 Host 区分路由（date → 管理后台，www → H5 站），规则在它自己仓库的
#     docker/nginx/etc/nginx.conf 里，本文件只负责 TLS 终止与回源
# 拓扑：客户端 → 宿主 Nginx(443, TLS 终止) → HTTPS 回源 127.0.0.1:8080 → qys_nginx 容器 443
#   为什么不 HTTP 回源容器 80：qys 容器的 80 端口块是 `return 301 https://$host$request_uri`，
#   宿主直接回源到 80 会造成「301 → 宿主 443 → 回源 80 → 301」死循环，故必须回源容器 443。
# 证书：宿主用 LE 的 date.arvine.cn 证书（SAN 已含 date.arvine.cn / www.arvine.cn）；
#   容器内用于回源校验的证书副本由 /etc/letsencrypt/renewal-hooks/deploy/copy-qys-certs.sh 同步。

# 两个域名共用同一个 server 块：qiyuanshe 的回源行为完全一致，仅靠 Host 头区分站点。
# 若将来 www 需要独立配置（如换证书、加路径规则），再拆成两个 server 块。
server {
    listen 80;
    listen [::]:80;
    server_name date.arvine.cn www.arvine.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name date.arvine.cn www.arvine.cn;

    ssl_certificate     /etc/letsencrypt/live/date.arvine.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/date.arvine.cn/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass https://127.0.0.1:8080;
        proxy_http_version 1.1;

        # 回源是 TLS，必须显式指定 SNI 与待校验主机名，
        # 否则 nginx 会用 proxy_pass 里的 127.0.0.1 做主机名校验而失败
        proxy_ssl_server_name on;
        proxy_ssl_name        date.arvine.cn;
        proxy_ssl_verify      on;
        # nginx 默认 proxy_ssl_verify_depth=1，只允许 1 级中间证书；
        # 而 LE 新链为 4 级（leaf -> YE1 -> Root YE -> ISRG Root X2 -> ISRG Root X1），
        # 不放开深度会报 "unable to get issuer certificate"（已实测踩坑）。
        proxy_ssl_verify_depth 5;
        # 信任源用系统 CA 包而非 LE 的 chain.pem：chain.pem 只含中间证书、不含根，
        # 直接用它校验同样会报 "unable to get issuer certificate"。
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 覆写而非追加：qiyuanshe 侧的限流同样依赖真实客户端 IP
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # WebSocket（qiyuanshe 的 /ws/chat）需要长连接升级
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header X-Forwarded-Host $host;
    }
}
