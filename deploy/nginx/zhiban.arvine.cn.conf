# zhiban.arvine.cn —— 知伴管理后台入口（宿主级 Nginx vhost）
# 依据：docs/constitution.md 第 728 行「管理后台：独立路径 + IP 白名单 + 账号密码 + 二次验证；
#       后台接口与小程序接口分离鉴权」
# 域名归属（2026-09-19 裁决）：m.arvine.cn 专属于小程序 API；zhiban.arvine.cn 专属于管理后台（模块 8）；
#       date.arvine.cn / www.arvine.cn 属同机 qiyuanshe 项目。
# 生效方式：软链到 /etc/nginx/conf.d/zhiban.arvine.cn.conf（本文件随仓库版本管理）
# 证书：Let's Encrypt（certbot webroot 模式，2026-09-19 签发，到期 2026-12-17）；
#       续期由 certbot-renew.timer 触发，续期后由 deploy/reload-nginx.sh 重载 nginx。

# ---------------------------------------------------------------------------
# HTTP：只承担 ACME 挑战与跳转 HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name zhiban.arvine.cn;

    # ACME HTTP-01 挑战目录，证书续期依赖此路径，不得删除
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS：管理后台（模块 8 接入前的占位）
# 模块 8 开工时把 location / 换成静态站点（root + try_files 回退 index.html），
# 并在此处叠加 IP 白名单（allow/deny）与后台接口反代。
# 注：后台接口与小程序接口分离鉴权，规划走 /api/admin/**，与 m 站的 /api/v1/** 互不干扰。
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zhiban.arvine.cn;

    ssl_certificate     /etc/letsencrypt/live/zhiban.arvine.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhiban.arvine.cn/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # 不下发 includeSubDomains（同机还有 m / date / www 等子域），也不加 preload
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    # 管理后台是内部系统，禁止被搜索引擎收录
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        default_type text/plain;
        return 200 "zhiban.arvine.cn ready (admin console: module 8 pending)\n";
    }
}
