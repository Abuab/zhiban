# zhiban.arvine.cn —— 知伴管理后台入口（宿主级 Nginx vhost）
# 依据：docs/constitution.md 第 728 行「管理后台：独立路径 + IP 白名单 + 账号密码 + 二次验证；
#       后台接口与小程序接口分离鉴权」；docs/adr/ADR-003.md（决策 5：宿主 Nginx 静态托管）
# 域名归属（2026-09-19 裁决）：m.arvine.cn 专属于小程序 API；zhiban.arvine.cn 专属于管理后台（模块 8）；
#       date.arvine.cn / www.arvine.cn 属同机 qiyuanshe 项目。
# 生效方式：软链到 /etc/nginx/conf.d/zhiban.arvine.cn.conf（本文件随仓库版本管理）
# 证书：Let's Encrypt（certbot webroot 模式，2026-09-19 签发，到期 2026-12-17）；
#       续期由 certbot-renew.timer 触发，续期后由 deploy/reload-nginx.sh 重载 nginx。
#
# ⚠️ IP 白名单不写在本文件里（白名单是部署期信息，随运维地点变化，属"可变量"，不进仓库）。
#    本文件通过下面的 include 读取宿主上的 /etc/nginx/conf.d/zhiban-admin-allow.inc
#    （只含 allow/deny 行，chmod 600，不入库；模板见同目录 zhiban-admin-allow.inc.example）。
#    该文件缺失会让 nginx -t 失败 → 属**有意的 fail-closed**：宁可后台不可用，也不能裸奔对外开放。
#    为什么用 .inc 扩展名：主配置是 include /etc/nginx/conf.d/*.conf，用 .inc 可避免被当作
#    顶层配置重复加载（allow/deny 在 http 上下文非法，会导致 nginx -t 报错）。

# ---------------------------------------------------------------------------
# HTTP：只承担 ACME 挑战与跳转 HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name zhiban.arvine.cn;

    # ACME HTTP-01 挑战目录，证书续期依赖此路径，不得删除
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS：后台（SPA 静态托管 + /api/admin 反代到本机 NestJS 127.0.0.1:3000）
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zhiban.arvine.cn;

    ssl_certificate     /etc/letsencrypt/live/zhiban.arvine.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhiban.arvine.cn/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # 不下发 includeSubDomains（同机还有 m / date / www 等子域），也不加 preload
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    # 管理后台是内部系统，禁止被搜索引擎收录
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 后台只用于改文案/看列表，不传大文件；限额取小值降低滥用面
    client_max_body_size 2m;
    client_body_timeout 30s;

    # 后台接口与后台前端所需的小程序侧只读接口
    # 服务端全局前缀为 /api；后台路由因显式 VERSION_NEUTRAL 落在 /api/admin/**（ADR-003 决策 1）。
    # 反代到与 m 站同一个 NestJS 进程：后台鉴权由 AdminAuthGuard 独立完成，
    # 与小程序 AuthGuard 四维隔离（独立密钥 / typ=admin / admin_session: 前缀 / 独立守卫）。
    #
    # 这里代理**整个 /api/** 而不是只写 /api/admin/，原因（真实踩坑）：
    #   后台前端启动时要调 GET /api/v1/config/public 取品牌名（宪法 P5：品牌名不得硬编码）；
    #   若只代理 /api/admin/，该请求会落到下面的静态 location，被 try_files 回退成 index.html
    #   并以 200 返回，前端解析不到 code 字段 → 品牌名**永远取不到且不报错**（静默死功能）。
    #   本域名本就只对白名单 IP 开放（第一层 allow/deny 在主防线），无需按路径再收窄；
    #   业务接口仍有各自的鉴权与限流，不因同域反代而放宽。
    location /api/ {
        include /etc/nginx/conf.d/zhiban-admin-allow.inc;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 【必须覆写而非追加】服务端 request-ip.util 只采信来自本机回环的 X-Forwarded-For
        # 并取「最后一段」。若写成 $proxy_add_x_forwarded_for，客户端伪造的 IP 会留在首位，
        # 将同时绕过「后台 IP 白名单」与「登录限流」（该伪造手法在 m 站已实测可 100% 绕过）。
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # 后台 SPA 静态产物（与接口同属后台域名，同样只对白名单 IP 开放）
    # 注：刻意不为 js/css 单独配 location 做缓存——location 内一旦出现 add_header，
    #     server 级的 HSTS / X-Robots-Tag 就不再继承，收益不抵风险。
    location / {
        include /etc/nginx/conf.d/zhiban-admin-allow.inc;

        root /opt/zhiban/admin/dist;
        index index.html;
        # 前端为 history 模式路由，未命中的路径回退到 index.html
        try_files $uri $uri/ /index.html;
    }
}
