# 《知伴》服务编排（MySQL 8 + Redis 7 + 业务 API）
#
# 用途：一条命令起停整套后端 —— `docker compose up -d` / `docker compose down`
# 部署形态见 docs/adr/ADR-006.md：宿主 Nginx 作唯一入口（TLS/证书续期留在宿主），
#   业务 API 运行在容器内（取代此前裸 node + setsid nohup 的方式）。
# 阶段 0 裁决 D-1：P1 全免费，本文件不包含任何支付相关服务

services:
  mysql:
    image: mysql:8.0
    container_name: zhiban-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhiban}
      MYSQL_USER: ${MYSQL_USER:-zhiban}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zhiban123456}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      # 仅监听回环地址：答题数据/报告属高敏隐私，禁止将 3306 暴露到公网
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动自动执行建表脚本（docs/schema.sql，24 张表）
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - zhiban

  redis:
    image: redis:7-alpine
    container_name: zhiban-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-zhiban123456}
    ports:
      # 仅监听回环地址：禁止将 6379 暴露到公网（Redis 未做鉴权粒度控制）
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-zhiban123456}
    networks:
      - zhiban

  # 业务 API（NestJS）：单实例容器，宿主 Nginx 反代 127.0.0.1:3000
  #
  # 网络：`network_mode: host` 是**刻意选择**（ADR-006 决策 3），不是图省事——
  #   Nginx 与 API 同机回源，而应用只在「直连方为回环地址」时才采信 X-Forwarded-For
  #   （src/common/utils/request-ip.util.ts 的 TRUSTED_PROXY_ADDRESSES）；
  #   若改用桥接网络，容器内看到的直连方会变成 Docker 网关 IP，XFF 被丢弃 →
  #   全体用户共用一个 IP 限流桶（误伤）且后台 IP 白名单判定失真。
  #   故 DB_HOST / REDIS_HOST / APP_HOST 沿用 .env 中的 127.0.0.1
  #   （mysql/redis 的端口已发布到宿主回环，容器经宿主回环访问，语义与迁移前一致）。
  api:
    build:
      context: ./server
    image: zhiban-api:latest
    container_name: zhiban-api
    restart: unless-stopped
    network_mode: host
    env_file:
      # 密钥与运行环境变量不入镜像，运行期注入（chmod 600，未入库）
      - ./server/.env
    volumes:
      # 后台上传的图片（客服二维码等，ADR-010 决策 5）落宿主目录统一保留。
      # ⚠️ 必检项：不挂载则文件写进容器可写层，`docker compose up -d --build` 重建容器后全部丢失，
      #    而 sys_config.support.qrcode_url 仍指向这些地址 → 端上变成破图。
      #    宿主路径即仓库根 ./uploads，与 Nginx `alias /opt/zhiban/uploads/` 对应（仓库部署在 /opt/zhiban）。
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 单机 3.6G 且与 qiyuanshe 同机共存：限额避免相互挤兑（Node 常驻约 150-250M）
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
    name: zhiban_mysql_data
  redis_data:
    name: zhiban_redis_data

networks:
  zhiban:
    name: zhiban_net
